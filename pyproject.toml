[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playwright-code-generator"
version = "1.0.0"
description = "World-class MCP server for generating Playwright TypeScript tests from accessibility snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
playwright-code-generator = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
